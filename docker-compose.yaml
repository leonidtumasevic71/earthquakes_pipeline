x-airflow-common:
  &airflow-common
  build: .
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}

    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}

    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'

    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: 'admin:admin'

    PYTHONPATH: /opt/airflow

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./src:/opt/airflow/src
    - ./config.py:/opt/airflow/config.py

  depends_on:
    postgres:
      condition: service_healthy
    pipeline-db:
      condition: service_healthy

services:

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy

  # --- Postgres для метаданных Airflow (не трогаем) ---
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER}" ]
      interval: 5s
      retries: 5
    restart: always

  # --- Postgres для данных пайплайна (НОВЫЙ) ---
  pipeline-db:
    image: postgres:13

    environment:
      POSTGRES_USER: ${PIPELINE_DB_USER}
      POSTGRES_PASSWORD: ${PIPELINE_DB_PASSWORD}
      POSTGRES_DB: ${PIPELINE_DB_NAME}

      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}

    ports:
      - "${PIPELINE_DB_PORT}:5432"

    volumes:
      - pipeline-db-volume:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${PIPELINE_DB_USER}",
          "-d",
          "${PIPELINE_DB_NAME}"
        ]
      interval: 5s
      retries: 5

    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
      pipeline-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
      pipeline-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    restart: always

  airflow-dag-processor:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
      pipeline-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor
    restart: always

  airflow-triggerer:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
      pipeline-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: triggerer
    restart: always

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres-db-volume:
  pipeline-db-volume:      # <--- новый volume для данных пайплайна
  minio_data:
  grafana_data: