x-airflow-common:
  &airflow-common
  build: .
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/

    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}

    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}

    RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
    RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    DB_CONN_STRING: ${DB_CONN_STRING}
    API_URL: ${API_URL}

    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'


    PYTHONPATH: /opt/airflow

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./src:/opt/airflow/src
    - ./config.py:/opt/airflow/config.py

  depends_on:
    postgres:
      condition: service_healthy
    pipeline-db:
      condition: service_healthy
    rustfs:
      condition: service_healthy

services:

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      GRAFANA_DB_USER: ${GRAFANA_DB_USER}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      PIPELINE_DB_NAME: ${PIPELINE_DB_NAME}

    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      postgres:
        condition: service_healthy
      pipeline-db:
        condition: service_healthy

  # --- Postgres для метаданных Airflow (не трогаем) ---
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER}" ]
      interval: 5s
      retries: 5
    restart: always

  # --- Postgres для данных пайплайна (НОВЫЙ) ---
  pipeline-db:
    image: postgres:17

    environment:
      POSTGRES_USER: ${PIPELINE_DB_USER}
      POSTGRES_PASSWORD: ${PIPELINE_DB_PASSWORD}
      POSTGRES_DB: ${PIPELINE_DB_NAME}

      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana}

    ports:
      - "127.0.0.1:${PIPELINE_DB_PORT}:5432"

    volumes:
      - pipeline-db-volume:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${PIPELINE_DB_USER}",
          "-d",
          "${PIPELINE_DB_NAME}"
        ]
      interval: 5s
      retries: 5

    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
      pipeline-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      rustfs:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pipeline-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    restart: always

  airflow-dag-processor:
    <<: *airflow-common
    depends_on:
      rustfs:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pipeline-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor
    restart: always

  airflow-triggerer:
    <<: *airflow-common
    depends_on:
      rustfs:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pipeline-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: triggerer
    restart: always

  rustfs:
    image: rustfs/rustfs:1.0.2
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_HEALTH_ENDPOINT_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    volumes:
      - rustfs_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9000/health/ready >/dev/null && curl -fsS http://127.0.0.1:9001/rustfs/console/health >/dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

    restart: unless-stopped

volumes:
  postgres-db-volume:
  pipeline-db-volume:
  rustfs_data:
  grafana_data: